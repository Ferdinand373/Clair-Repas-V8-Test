name: Validate static PWA

on:
  pull_request:
  push:
    branches:
      - main
      - "V8---Foundation"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static PWA invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check standalone JavaScript syntax
        run: |
          node --check sw.js
          node --check v8/clair-foundation.js

      - name: Validate application and PWA invariants
        run: node scripts/validate-static-app.mjs
